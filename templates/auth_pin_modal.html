{# Reusable Bootstrap 5 supervisor PIN prompt. Include once on each protected page. #}
{% include 'ui_feedback.html' %}
<script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth_pin_modal.css') }}">

<div class="modal fade" id="authPinModal" tabindex="-1" aria-labelledby="authPinModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow">
            <form id="authPinForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="authPinModalTitle">Supervisor authorization</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="small text-secondary mb-3" id="authPinModalMessage">Enter your supervisor PIN to continue.</p>
                    <label class="form-label small fw-semibold" for="authPinInput">Supervisor PIN</label>
                    <input type="password" inputmode="numeric" autocomplete="one-time-code" class="form-control" id="authPinInput" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Authorize</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    window.SupervisorAuthorization = (() => {
        let pendingAction = null;
        const modalElement = document.getElementById('authPinModal');
        const modal = new bootstrap.Modal(modalElement);
        const form = document.getElementById('authPinForm');
        const input = document.getElementById('authPinInput');
        const message = document.getElementById('authPinModalMessage');

        modalElement.addEventListener('shown.bs.modal', () => input.focus());
        modalElement.addEventListener('hidden.bs.modal', () => {
            if (pendingAction) {
                pendingAction.reject(new Error('Authorization cancelled'));
                pendingAction = null;
            }
            form.reset();
        });

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            if (!pendingAction) return;
            const action = pendingAction;
            pendingAction = null;
            modal.hide();
            action.resolve(input.value);
        });

        function requestPin(prompt = 'Enter your supervisor PIN to continue.') {
            return new Promise((resolve, reject) => {
                pendingAction = { resolve, reject };
                message.textContent = prompt;
                modal.show();
            });
        }

        function reauthenticate(prompt = 'Your session has expired. Enter your supervisor PIN to continue.') {
            return requestPin(prompt).then((pin) => fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'pin=' + encodeURIComponent(pin)
            }).then((response) => {
                if (response.url.includes('/login')) throw new Error('Incorrect PIN.');
            }));
        }

        function protectForm(form, prompt) {
            requestPin(prompt).then((pin) => {
                let pinField = form.querySelector('input[name="auth_pin"]');
                if (!pinField) {
                    pinField = document.createElement('input');
                    pinField.type = 'hidden';
                    pinField.name = 'auth_pin';
                    form.appendChild(pinField);
                }
                pinField.value = pin;
                form.submit();
            }).catch(() => {});
            return false;
        }

        return { requestPin, protectForm, reauthenticate };
    })();
</script>
